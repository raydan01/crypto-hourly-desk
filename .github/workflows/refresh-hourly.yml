name: Refresh hourly market snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-hourly-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public snapshot
        run: python refresh_hourly.py
      - name: Validate and publish only the two public artifacts
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^...//')"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" != "data/market-opportunities-hourly-latest.json" && "$path" != "data/social-context-v2-latest.json" ]]; then
              echo "Unexpected changed path; refusing publication: $path" >&2
              exit 1
            fi
          done <<< "$changed"
          git add -- data/market-opportunities-hourly-latest.json data/social-context-v2-latest.json
          staged="$(git diff --cached --name-only | sort -u)"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" != "data/market-opportunities-hourly-latest.json" && "$path" != "data/social-context-v2-latest.json" ]]; then
              echo "Unexpected staged path; refusing publication: $path" >&2
              exit 1
            fi
          done <<< "$staged"
          git diff --cached --quiet || {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh hourly market snapshot"
            git push origin HEAD:main
          }
