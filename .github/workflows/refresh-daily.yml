name: Refresh weekly trading snapshot

on:
  schedule:
    - cron: "31 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-daily.yml
      - scripts/publish-daily-snapshot.sh

permissions:
  contents: write

concurrency:
  group: refresh-daily-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh Kraken public daily snapshot
        run: python refresh_daily.py
      - name: Publish daily snapshots without overwriting concurrent updates
        shell: bash
        run: bash scripts/publish-daily-snapshot.sh
